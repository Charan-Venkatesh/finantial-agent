services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial_agent_backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      ENVIRONMENT: production
      DEBUG: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # New React frontend
  frontend-react:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: financial_agent_frontend_react
    ports:
      - "3000:80"
    depends_on:
      - backend

